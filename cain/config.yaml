# https://developers.home-assistant.io/docs/apps/configuration
# A Claude Code session that stays running and answers one private Discord
# bot (Anthropic's Discord channel plugin). Its only state is /data. Its only
# page is Ingress: a terminal for the one-time sign-in, reachable only through
# Home Assistant (nginx admits the Ingress proxy and nothing else).
name: Cain
version: "0.19.0"
slug: cain
description: >-
  A Claude Code session that stays running on this box and answers your private
  Discord bot, with your Claude connectors.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
# The Supervisor's watchdog (Cain 0.15.0): with the Watchdog switch on the App's page turned on, the
# Supervisor starts the App again when its container stops on an error (a kill, a crash, or the App
# restarting itself when Cain's Discord channel stays down) and when this answers an error. nginx
# answers it to Home Assistant's internal hassio network, 172.30.32.0/23, and 404 to any other
# address (rootfs/etc/nginx/nginx.conf), 503 only while a self-restart
# is due (the mark is set just before the App stops). The switch is read through /addons/self/info
# and the restart asked through /addons/self/restart, which need no API role (hassio_api stays off).
watchdog: http://[HOST]:[PORT:8098]/health
panel_icon: mdi:account-tie
panel_title: Cain
panel_admin: true
homeassistant_api: false
hassio_api: false
auth_api: false
backup: cold
# The link's two keys stay out of backups: whoever holds a backup can't sign a Ship
# tap or update main with them. A restored Pi makes new ones (RELEASING.md, "If the
# deploy key is remade"). Keeper 0.1.14: the drill flags' spent nonces too (link/drill.ts), so a restored backup
# never brings back a spent list that forgets a nonce spent after it was taken (Keeper keeps every drill nonce as well).
backup_exclude:
  - "link/deploy_key*"
  - "link/ship.key*"
  - "link/keeper-drill-spent*"
timeout: 30
# Keys, entered by Dane here, never shown or logged. github_token: the record
# keeper's GitHub fine-grained token for the org repo only (Contents read and write).
# The three API keys go only to the review runner: Gemini and Perplexity on small
# prepaid balances (auto-reload off), Anthropic from his linked Console org (his
# plan's monthly API credit). Caps: per review, and per seat per month.
# pc_jobs_token: the PC job keeper's fine-grained token for the PC job queue repo only
# (pc_jobs_repo, Contents read and write). Empty: no PC jobs.
# heartbeat_url: the security watch's outside heartbeat (a Healthchecks.io ping URL, or any
# https URL of that kind). Pinged every 5 minutes, and <url>/fail when the App stops on an
# error; the service warns the owner itself when the pings stop. A secret like a key: not logged,
# not in any child's environment (only the heartbeat's own process has it); stored only in the
# App's options (/data/options.json, where Supervisor keeps every option: that is fine). Cain's own
# session can read that file, so a compromised session can read the URL: keep it like a key. A leaked
# URL can mask an outage or fake a failure. Empty: no heartbeat, and the morning check-in says so.
# probe_heartbeat_url (0.14.0): the probe's own outside heartbeat, a second check at the same service
# as heartbeat_url (its own ping URL). Pinged only after a liveness pass that passed (every 5 minutes),
# the owner's Stop included (his session runs through it), so the service alarms the owner when Cain's
# parts stop running, not only when the App stops. Only the App's own stopped mode, or a probe folder
# that isn't right (it alarms that too), stops it. Read only by
# the probe's own subshell (the run script), never by Cain's session, never logged. Empty: no ping.
# owner_user_id: the Home Assistant user id of the one person Cain's panel opens
# for (not a key). While it's empty, the panel answers Forbidden to everyone. Its
# pattern takes "" too: Supervisor checks any value that's there, optional or not.
# review_round_cap: outside review rounds a change may have (the owner's rule: 3). The runner keeps it;
# Cain's own user can't change it. usage_reserve_percent: the usage guard's reserve floor, a share of
# the week's plan allowance and of each review seat's monthly cap that "other" work may not spend.
# keeper_url, keeper_token (0.19.0): the keeper App (keeper/ in this repo) on Home Assistant's internal
# network, and Cain's own token there (the same token as the keeper's tokens entry for this App, at
# least 16 characters). The probe gives the keeper its verdict on an install of Cain with it, and the
# link reads whether the keeper's way back from a bad install is armed. Read only by the run script's link and
# probe subshells, never by Cain's session, never logged. Empty: no verdicts, and never armed.
# notice_hook: the id of the Home Assistant webhook the App's alarms go to (DOCS.md,
# "If Cain stops"), a random id hidden like a key. Empty: the alarms go to Discord only.
options:
  github_token: ""
  gemini_api_key: ""
  perplexity_api_key: ""
  anthropic_api_key: ""
  review_limit_usd: 1.5
  gemini_monthly_usd: 8
  perplexity_monthly_usd: 4
  anthropic_monthly_usd: 30
  codex_monthly_runs: 200
  review_round_cap: 3
  usage_reserve_percent: 25
  owner_user_id: ""
  notice_hook: ""
  pc_jobs_token: ""
  pc_jobs_repo: "HyndeSyte/pc-jobs"
  heartbeat_url: ""
  probe_heartbeat_url: ""
  keeper_url: "http://0fcc2575-keeper:8097"
  keeper_token: ""
schema:
  github_token: password?
  gemini_api_key: password?
  perplexity_api_key: password?
  anthropic_api_key: password?
  review_limit_usd: float(0,20)
  gemini_monthly_usd: float(0,200)
  perplexity_monthly_usd: float(0,200)
  anthropic_monthly_usd: float(0,200)
  codex_monthly_runs: int(0,5000)
  review_round_cap: int(1,10)
  usage_reserve_percent: int(0,90)
  owner_user_id: match(^([0-9a-f]{32})?$)?
  notice_hook: password?
  pc_jobs_token: password?
  pc_jobs_repo: match(^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$)?
  heartbeat_url: password?
  probe_heartbeat_url: password?
  keeper_url: match(^http://[A-Za-z0-9.-]{1,253}(:[0-9]{1,5})?$)?
  keeper_token: password?
