# https://developers.home-assistant.io/docs/apps/configuration
# A Claude Code session that stays running and answers one private Discord
# bot (Anthropic's Discord channel plugin). Its only state is /data. Its only
# page is Ingress: a terminal for the one-time sign-in, reachable only through
# Home Assistant (nginx admits the Ingress proxy and nothing else).
name: Cain
version: "0.7.3"
slug: cain
description: >-
  A Claude Code session that stays running on this box and answers your private
  Discord bot, with your Claude connectors.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:account-tie
panel_title: Cain
panel_admin: true
homeassistant_api: false
hassio_api: false
auth_api: false
backup: cold
timeout: 30
# Keys, entered by Dane here, never shown or logged. github_token: the record
# keeper's GitHub fine-grained token for the org repo only (Contents read and write).
# The three API keys go only to the review runner: Gemini and Perplexity on small
# prepaid balances (auto-reload off), Anthropic from his linked Console org (his
# plan's monthly API credit). Caps: per review, and per seat per month.
# owner_user_id: the Home Assistant user id of the one person Cain's panel opens
# for (not a key). While it's empty, the panel answers Forbidden to everyone. Its
# pattern takes "" too: Supervisor checks any value that's there, optional or not.
options:
  github_token: ""
  gemini_api_key: ""
  perplexity_api_key: ""
  anthropic_api_key: ""
  review_limit_usd: 1.5
  gemini_monthly_usd: 8
  perplexity_monthly_usd: 4
  anthropic_monthly_usd: 30
  codex_monthly_runs: 200
  owner_user_id: ""
schema:
  github_token: password?
  gemini_api_key: password?
  perplexity_api_key: password?
  anthropic_api_key: password?
  review_limit_usd: float(0,20)
  gemini_monthly_usd: float(0,200)
  perplexity_monthly_usd: float(0,200)
  anthropic_monthly_usd: float(0,200)
  codex_monthly_runs: int(0,5000)
  owner_user_id: match(^([0-9a-f]{32})?$)?
