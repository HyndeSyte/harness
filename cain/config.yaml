# https://developers.home-assistant.io/docs/apps/configuration
# A Claude Code session that stays running and answers one private Discord
# bot (Anthropic's Discord channel plugin). Its only state is /data. Its only
# page is Ingress: a terminal for the one-time sign-in, reachable only through
# Home Assistant (nginx admits the Ingress proxy and nothing else).
name: Cain
version: "0.1.3"
slug: cain
description: >-
  A Claude Code session that stays running on this box and answers your private
  Discord bot, with your Claude connectors.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:account-tie
panel_title: Cain
panel_admin: true
homeassistant_api: false
hassio_api: false
auth_api: false
backup: cold
timeout: 30
