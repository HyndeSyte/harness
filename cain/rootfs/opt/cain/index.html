<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cain</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 15px system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  #bar { display: none; padding: 10px 14px; background: #2a2a2a; }
  #bar a { color: #fff; background: #5865f2; padding: 8px 14px; border-radius: 6px; text-decoration: none; font-weight: 600; }
  #bar span { margin-left: 10px; color: #bbb; }
  #send { display: flex; gap: 8px; margin-top: 10px; }
  #send input { flex: 1; min-width: 0; padding: 8px; font-size: 16px; border-radius: 6px; border: 1px solid #555; background: #111; color: #eee; }
  #send button { padding: 8px 14px; border: 0; border-radius: 6px; background: #3ba55d; color: #fff; font-weight: 600; }
  iframe { flex: 1; border: 0; width: 100%; }
</style></head>
<body>
<div id="bar"><a id="go" href="#" target="_blank" rel="noopener">Sign in to Claude</a><span>Then paste the code here:</span>
  <form id="send"><input id="code" autocomplete="off" placeholder="Paste code"><button>Send</button></form></div>
<iframe src="tty/" title="Cain session"></iframe>
<script>
  // Typing into the terminal is hard on a phone, so the code goes in through the box.
  // ttyd exposes its terminal as window.term; sending data is the same as typing it.
  document.getElementById("send").addEventListener("submit", (e) => {
    e.preventDefault();
    const box = document.getElementById("code");
    const text = box.value.trim();
    const term = document.querySelector("iframe").contentWindow.term;
    if (!text || !term) return;
    const type = (s) => term.input ? term.input(s, true) : term._core.coreService.triggerDataEvent(s, true);
    type(text);
    setTimeout(() => type("\r"), 300);
    box.value = "";
  });
</script>
<script>
  // The terminal breaks the long sign-in link across lines; the add-on rejoins it
  // into ./signin. Show it as one button while a sign-in is on screen.
  async function check() {
    try {
      const r = await fetch("signin", { cache: "no-store" });
      const doc = new DOMParser().parseFromString(await r.text(), "text/html");
      const a = doc.querySelector("a[href^='https://']");
      const bar = document.getElementById("bar");
      if (a) { document.getElementById("go").href = a.getAttribute("href"); bar.style.display = "block"; }
      else { bar.style.display = "none"; }
    } catch (e) {}
  }
  check(); setInterval(check, 2000);
</script>
</body></html>
