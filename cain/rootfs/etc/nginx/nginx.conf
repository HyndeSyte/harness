worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # $cain_owner: 1 only for the owner. Ingress sends the signed-in Home Assistant
  # user's id as X-Remote-User-Id and drops any copy the browser sent. terminal/run
  # writes this map from owner_user_id at each start (/opt/cain/owner-gate.sh).
  include /etc/nginx/owner.conf;
  server {
    listen 8099 default_server;
    # Home Assistant's Ingress proxy only.
    allow 172.30.32.2;
    deny all;
    # And only its owner. Anyone else, or a request with no user, gets 403 here,
    # before any location: the page, the sign-in link, status, Codex, the terminal.
    if ($cain_owner != 1) { return 403 "Cain's panel opens only for its owner (owner_user_id in this App's Configuration).\n"; }
    # The Cain page: a sign-in bar over the terminal. Paths are relative, so
    # they work under the Ingress prefix.
    location = / {
      default_type text/html;
      add_header Cache-Control no-store;
      # Not alias: on "/" nginx appends the index name to an alias (0.1.4's 500).
      root /opt/cain;
      try_files /index.html =404;
    }
    location = /signin {
      default_type text/html;
      add_header Cache-Control no-store;
      alias /tmp/signin.html;
    }
    location = /status {
      default_type application/json;
      add_header Cache-Control no-store;
      alias /tmp/status.json;
    }
    # ChatGPT sign-in for the Codex review seat: the review runner, on localhost.
    location /codex {
      proxy_pass http://127.0.0.1:8096;
      proxy_http_version 1.1;
      add_header Cache-Control no-store;
    }
    location /tty/ {
      proxy_pass http://127.0.0.1:7681;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1d;
    }
  }
}
