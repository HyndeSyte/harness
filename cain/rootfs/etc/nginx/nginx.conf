# The workers as nobody:nogroup, named here rather than left to the build's default: the panel's
# pages and sockets are root:nogroup in /run/cain-web (lock.sh run).
user nobody nogroup;
worker_processes 1;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # $cain_owner: 1 only for the owner. Ingress sends the signed-in Home Assistant
  # user's id as X-Remote-User-Id and drops any copy the browser sent. terminal/run
  # writes this map from owner_user_id at each start (/opt/cain/owner-gate.sh).
  include /etc/nginx/owner.conf;
  server {
    listen 8099 default_server;
    # Home Assistant's Ingress proxy only.
    allow 172.30.32.2;
    deny all;
    # And only its owner. Anyone else, or a request with no user, gets 403 here,
    # before any location: the page, the sign-in link, status, Codex, the terminal.
    if ($cain_owner != 1) { return 403 "Cain's panel opens only for its owner (owner_user_id in this App's Configuration).\n"; }
    # The Cain page: a sign-in bar over the terminal. Paths are relative, so
    # they work under the Ingress prefix.
    location = / {
      default_type text/html;
      add_header Cache-Control no-store;
      # Not alias: on "/" nginx appends the index name to an alias (0.1.4's 500).
      root /opt/cain;
      try_files /index.html =404;
    }
    location = /signin {
      default_type text/html;
      add_header Cache-Control no-store;
      alias /run/cain-web/www/signin.html;
    }
    location = /status {
      default_type application/json;
      add_header Cache-Control no-store;
      alias /run/cain-web/www/status.json;
    }
    # ChatGPT sign-in for the Codex review seat: the review runner, on a unix socket only
    # nginx's workers and root can open (C1 plan 3.9).
    location /codex {
      proxy_pass http://unix:/run/cain-web/upstream/codex.sock;
      proxy_http_version 1.1;
      add_header Cache-Control no-store;
    }
    location /tty/ {
      proxy_pass http://unix:/run/cain-web/upstream/ttyd.sock;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1d;
    }
  }
  # The Supervisor's watchdog (config.yaml's watchdog URL, Cain 0.15.0): 200 while the App is
  # well (since 0.17.0 also: while the link's Discord gateway is connected), 503 while a self-restart is due (the run script's mark, set just before the App stops),
  # so with the App's Watchdog switch on the Supervisor restarts it. Second round: for the Supervisor
  # alone (172.30.32.2, as for the panel), not every App on Home Assistant's network, and 404 for any
  # other path. The address is checked by $cain_health_from in the location itself: a return runs
  # before allow and deny would, so those alone would let anyone through.
  # Third round: the Supervisor's probe address was never seen on the device, and a probe from any
  # other address would get 404 every time and, with the switch on, restart the App in a loop with no
  # mark, row or alarm. So the hassio network as a whole (172.30.32.0/23) gets the answer, which is a
  # non-secret up-or-down bit; every other address, and every other path, still gets 404. Each /health
  # 404 is noted with its address (health-miss.log), and the run script says so in the App's log at
  # most once a minute, so a mismatch shows there (probe-drill.sh 7 checks it on the Pi).
  geo $cain_health_from { default 0; 172.30.32.0/23 1; }
  map $status $cain_health_miss { 404 1; default 0; }
  log_format cain_health_miss '$remote_addr';
  # Fourth round: each 200 too, with its time, for probe-drill.sh 7's gate (the run script keeps it small).
  map $status $cain_health_ok { 200 1; default 0; }
  log_format cain_health_ok '$msec $remote_addr';
  server {
    listen 8098;
    allow 172.30.32.0/23;
    deny all;
    location = /health {
      default_type text/plain;
      add_header Cache-Control no-store;
      access_log /run/cain-web/health-miss.log cain_health_miss if=$cain_health_miss;
      access_log /run/cain-web/health-ok.log cain_health_ok if=$cain_health_ok;
      if ($cain_health_from != 1) { return 404; }
      if (-f /run/cain-web/www/health-down) { return 503 "a self-restart is due\n"; }
      # Cain 0.17.0: 200 only while the link's Discord gateway is connected and acknowledged within the last
      # 5 minutes (the link keeps this mark, link/health-gate.ts; the run script removes one 2 minutes stale).
      if (!-f /run/cain-web/www/health-gateway) { return 503 "Discord's gateway isn't connected\n"; }
      return 200 "ok\n";
    }
    location / { return 404; }
  }
}
