name: surface

# The surface's tests (surface/README.md): the exporter and the Worker under Bun, the Worker again
# under workerd with a real Durable Object, the cast check, and the app's tests, typecheck and web
# build. Not required checks; the required ones stay in tests.yml and pr.yml. Every action is pinned
# to a commit, the same ones tests.yml uses. Both deploy jobs need every one of these jobs.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # The exporter's tests include the strict-mode regression corpus (surface/export/corpus.test.ts):
      # every fixture row, alone, must come out under --strict as fixtures/strict-corpus.json says.
      - run: bun test surface/export surface/worker surface/app/scripts
      # No workers.dev host and no preview URLs for the Worker.
      - name: Worker config check
        run: bun surface/worker/check-wrangler.ts
      # No "as GatedText", "as unknown as" or the type any anywhere in surface/, the sanitiser module
      # (surface/export/lib.ts) included, but for mark()'s one brand-minting line, allowed by its exact
      # content; comments and strings don't count.
      - name: Cast check
        run: bun surface/check-casts.ts

  # The Worker bundled as it deploys, run by Miniflare in workerd (the runtime Cloudflare uses) with
  # the real SQLite-backed Durable Object bound as STORE: the store's ordering, retired keys, the clock
  # bounds, version 1, Access, a concurrent upload race, and races with revisions (equal seq with
  # different commits, a higher seq with an older made_at, and mixed revisions, in both orders).
  surface-workerd:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surface/worker/workerd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: The Worker under workerd
        run: bun test ./suite.workerd.ts

  surface-app:
    runs-on: ubuntu-latest
    env:
      # The build needs nothing from Expo's servers.
      EXPO_OFFLINE: "1"
      # The app's public settings, from repository variables (blank until the deploy; the app then
      # says no key is set). Public values only: no secret goes into a web build.
      EXPO_PUBLIC_SURFACE_PUBLIC_KEY: ${{ vars.SURFACE_PUBLIC_KEYS }}
      EXPO_PUBLIC_SURFACE_TALK_URL: ${{ vars.SURFACE_TALK_URL }}
    defaults:
      run:
        working-directory: surface/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      # The lockfile's expo, react, react-dom and react-native are one documented SDK 58 set
      # (expo's own bundledNativeModules.json), checked offline.
      - name: SDK 58 set
        run: bun scripts/check-sdk.mjs
      - run: bun run typecheck
      - run: bun run test
      - run: bunx expo export --platform web
      # No inline script in any .html file, and the headers file with its content policy, parsed.
      - name: Web export checks
        run: bun scripts/check-dist.mjs
      # The checked build, kept: the Pages deploy below serves exactly these bytes, never a rebuild.
      - name: Keep the checked build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surface-web-dist
          path: surface/app/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # Pages deploys the artifact CI built and checked above (surface/README.md, Deploy). Configured but
  # off: it runs only on a push to main once the repository variable SURFACE_PAGES_DEPLOY is "true",
  # with the Cloudflare secrets set. Until the owner has a Cloudflare account it never runs. It needs
  # the workerd suite as well as the Bun and app jobs.
  surface-pages-deploy:
    needs: [surface-bun, surface-app, surface-workerd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SURFACE_PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: surface-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: surface-web-dist
          path: surface/app/dist
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      # The same checks again, on the downloaded bytes about to be served.
      - name: Web export checks, on the artifact
        working-directory: surface/app
        run: bun scripts/check-dist.mjs
      - name: Deploy to Pages
        working-directory: surface/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.156.2 pages deploy dist --project-name surface --branch main

  # The Worker's deploy (surface/README.md, Deploy), gated the same way: configured but off. It runs
  # only on a push to main once the repository variable SURFACE_WORKER_DEPLOY is "true", with its own
  # token (Workers Scripts and routes only), and only after the Bun suite, the workerd suite and the
  # app job passed on that commit. It refuses a wrangler.toml with a placeholder left in it.
  surface-worker-deploy:
    needs: [surface-bun, surface-app, surface-workerd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SURFACE_WORKER_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: surface-worker-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: surface/worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Worker config check
        run: bun check-wrangler.ts
      - name: No placeholder left
        run: "! grep -n 'REPLACE_WITH' wrangler.toml"
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.156.2 deploy
