name: surface

# The surface's tests (surface/README.md): the exporter and the Worker under Bun, and the app's
# tests, typecheck and web build. Not required checks; the required ones stay in tests.yml and
# pr.yml. Every action is pinned to a commit, the same ones tests.yml uses.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun test surface/export surface/worker

  surface-app:
    runs-on: ubuntu-latest
    env:
      # The build needs nothing from Expo's servers.
      EXPO_OFFLINE: "1"
    defaults:
      run:
        working-directory: surface/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run test
      - run: bunx expo export --platform web
