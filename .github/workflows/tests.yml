name: tests

# `pytest` and `bun` are required checks on main (RELEASING.md). Keep the job
# names fixed, and add no paths or branches filters and no job-level `if`: a
# required check must run and report on every pull request. check_pr.py fails a
# pull request that changes that.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # PyYAML for tests/test_check_pr.py (the pr check parses YAML); the Apps don't use it.
      - run: pip install pytest "PyYAML==6.0.2"
      - run: python -m pytest -q -p no:cacheprovider

  # Cain's tests. Same Bun as Cain's image (cain/Dockerfile BUN_VERSION).
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun test cain/tests

  # The specialist's image, built as Home Assistant builds it, and its embedded build id compared with
  # the source tree's (0.24.0, tenth round): the install step keys its migration and the dry run to that
  # id, so the image and the tree must agree. Not a required check; it reports on every push.
  # Twentieth round: built with --no-cache and plain progress, so every layer is built in this run and
  # the log shows each one (a CACHED layer fails the job), and stamped with this run's id as a label,
  # checked before the compare, so the image compared can only be the one built here.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the specialist's image
        run: |
          set -o pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --no-cache --pull --progress=plain --label "harness.ci.run=$stamp" -t harness-ci harness 2>&1 | tee build.log
          if grep -E '^#[0-9]+ CACHED' build.log; then echo "a layer came from cache"; exit 1; fi
      - name: The image's build id equals the source tree's
        run: |
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          built=$(docker image inspect -f '{{ index .Config.Labels "harness.ci.run" }}' harness-ci)
          echo "built in run: $built (this run: $stamp)"
          test "$built" = "$stamp"
          tree=$(python3 harness/app/harness/buildid.py harness harness/app)
          image=$(docker run --rm --entrypoint cat harness-ci /opt/harness/BUILD_ID)
          echo "source tree: $tree"
          echo "image:       $image"
          test -n "$tree" && test "$tree" = "$image"
