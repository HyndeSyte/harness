name: tests

# `pytest` and `bun` are required checks on main (RELEASING.md). Keep the job
# names fixed, and add no paths or branches filters and no job-level `if`: a
# required check must run and report on every pull request. check_pr.py fails a
# pull request that changes that.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # PyYAML for tests/test_check_pr.py (the pr check parses YAML); the Apps don't use it.
      - run: pip install pytest "PyYAML==6.0.2"
      - run: python -m pytest -q -p no:cacheprovider

  # Cain's tests. Same Bun as Cain's image (cain/Dockerfile BUN_VERSION).
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun test cain/tests
      # C1's image test: Cain's real image (amd64 here; the Pi is arm64, where the first start
      # checks the real Discord login and a real Claude session before it switches), the
      # switch to his own user run on a fake /data and interrupted at every point.
      - name: Build Cain's image
        run: >-
          docker build -q -t cain-c1-test --build-arg BUILD_ARCH=amd64
          --build-arg BUILD_FROM="$(sed -n 's/^  amd64: //p' cain/build.yaml)" cain
      - name: The switch to his own user, in the image (cain/tests/image/c1.sh)
        run: bash cain/tests/image/c1.sh cain-c1-test
