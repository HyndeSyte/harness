name: tests

# `pytest` and `bun` are required checks on main (RELEASING.md). Keep the job
# names fixed, and add no paths or branches filters and no job-level `if`: a
# required check must run and report on every pull request. check_pr.py fails a
# pull request that changes that. Every action is pinned to a commit (Dependabot proposes
# updates). The weekly run and a manual run scan main's whole history for secrets (job secrets).
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # pytest, and PyYAML for tests/test_check_pr.py (the pr check parses YAML); the Apps
      # don't use either. Pinned in .github/ci/requirements.txt (Dependabot and the audit read it).
      - run: pip install -r .github/ci/requirements.txt
      - run: python -m pytest -q -p no:cacheprovider

  # Cain's tests. Same Bun as Cain's image (cain/Dockerfile BUN_VERSION).
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun test cain/tests
      # Claude Code's own updater is off in Cain's image (DISABLE_AUTOUPDATER), so its fixes arrive
      # only with App releases. A note when a newer Claude Code than the image's pin exists: a warning
      # on the run, never a failure (the lookup needs the network; no answer says so and passes).
      - name: Claude Code's pinned version (a note, never a failure)
        run: |
          pin="$(sed -n 's/^ARG CLAUDE_VERSION=//p' cain/Dockerfile)"
          latest="$(curl -fsS -m 15 https://registry.npmjs.org/@anthropic-ai/claude-code/latest 2>/dev/null | jq -r '.version // empty' 2>/dev/null || true)"
          if [ -z "$latest" ]; then echo "couldn't read Claude Code's newest version; pinned ${pin}"
          elif [ "$(printf '%s\n%s\n' "$pin" "$latest" | sort -V | tail -n 1)" != "$pin" ]; then
            echo "::warning title=Claude Code update::Claude Code ${latest} is out; Cain's image pins ${pin} (cain/Dockerfile CLAUDE_VERSION)"
          else echo "Claude Code ${pin} is the newest"; fi
      # A name or an import that doesn't resolve fails here: Bun runs TypeScript unchecked, so
      # one would crash only at run time. Type nits aren't gated (cain/tsconfig.check.json).
      - name: Names and imports in Cain's code resolve
        run: |
          mkdir -p /tmp/tscheck && cd /tmp/tscheck && printf '{"private": true}\n' > package.json
          bun add -d typescript@5.9.3 @types/bun@1.3.1 >/dev/null
          cd "$GITHUB_WORKSPACE"
          /tmp/tscheck/node_modules/.bin/tsc -p cain/tsconfig.check.json > /tmp/tsc.txt || true
          if grep -E "error TS(2304|2305|2307|2552|2724)" /tmp/tsc.txt; then exit 1; fi
          echo "every name and import resolves ($(grep -c 'error TS' /tmp/tsc.txt) type nits not gated)"
      # C1's image test: Cain's real image (amd64 here; the Pi is arm64, where the first start
      # checks the real Discord login and a real Claude session before it switches), the
      # switch to his own user run on a fake /data and interrupted at every point.
      - name: Build Cain's image
        run: >-
          docker build -q -t cain-c1-test --build-arg BUILD_ARCH=amd64
          --build-arg BUILD_FROM="$(sed -n 's/^  amd64: //p' cain/build.yaml)" cain
      - name: The switch to his own user, in the image (cain/tests/image/c1.sh)
        run: bash cain/tests/image/c1.sh cain-c1-test

  # The same image and switch on arm64, the Pi's own architecture (C1 review service, theme 7),
  # on GitHub's arm64 runner. Not a required check by name, but a Ship card waits for every
  # check on its head to pass.
  image-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build Cain's image (aarch64)
        run: >-
          docker build -q -t cain-c1-test --build-arg BUILD_ARCH=aarch64
          --build-arg BUILD_FROM="$(sed -n 's/^  aarch64: //p' cain/build.yaml)" cain
      - name: The switch to his own user, in the image (cain/tests/image/c1.sh)
        run: bash cain/tests/image/c1.sh cain-c1-test

  # The PC job worker runs on Dane's Windows PC: its tests run on Windows too. Not a
  # required check (RELEASING.md); pytest and bun above stay the gate.
  pcjobs-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun test cain/tests/pcjobs.test.ts

  # The security watch's checks on the repository (Cain 0.13.0). `secrets` is a check the pr
  # check requires to be here, intact (check_pr.py REQUIRED_JOBS); `audit` stays optional for
  # now, since it rests on network lookups. A known vulnerability with a fix, rated high or
  # critical, in what CI installs fails `audit`. Cain has no npm or Bun manifest; its step audits
  # one if a package.json appears. Unrated findings are kept as the run's artifact and summary.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # pip-audit and every package it pulls in, pinned with their hashes.
      - run: pip install --require-hashes -r .github/ci/audit-requirements.txt
      - name: Python (what CI installs; the calendar specialist installs nothing)
        run: |
          pip-audit -r .github/ci/requirements.txt --format json --output pip-audit.json || true
          test -s pip-audit.json
          status=0
          python -I .github/scripts/audit_gate.py pip-audit.json --unrated audit-unrated.txt || status=$?
          if [ -s audit-unrated.txt ]; then
            echo "::warning::unrated audit findings (a fix exists, no severity found); see the run's summary and its audit-findings artifact"
            { echo "### Unrated audit findings"; echo; sed 's/^/- /' audit-unrated.txt; } >> "$GITHUB_STEP_SUMMARY"
            cat audit-unrated.txt
          fi
          exit "$status"
      - name: Keep the findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-findings
          path: |
            pip-audit.json
            audit-unrated.txt
          if-no-files-found: ignore
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Cain (Bun)
        working-directory: cain
        run: |
          if [ -f package.json ]; then bun install --frozen-lockfile && bun audit --audit-level=high
          else echo "cain/ has no package.json: nothing to audit."; fi

  # A secret scan (gitleaks, pinned and checked by hash): any finding fails. A pull request's own
  # commits (base..head, whole history fetched); a push to another branch, its commits not in main;
  # a push to main, the weekly run and a manual run, main's whole history. No step is skipped, so
  # it always reports (the pr check refuses one with an `if`). The baseline, .gitleaksignore at the
  # repository's root, lists findings triaged as not secrets (one fingerprint a line, each under a
  # "#" line giving its reason); it starts empty, and the first full-history run after merge is
  # triaged into it (RELEASING.md).
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.28.0"
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gitleaks" gitleaks && rm gitleaks.tgz
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE..$HEAD"; what="the pull request's commits ($range)" ;;
            push) if [ "$REF" = refs/heads/main ]; then range=""; what="main's whole history"
                  else range="origin/main..HEAD"; what="this branch's commits not in main"; fi ;;
            *) range=""; what="the whole history of $REF" ;;
          esac
          echo "Scanning $what."
          if [ -n "$range" ]; then
            "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact --exit-code 1 --gitleaks-ignore-path .gitleaksignore --log-opts="$range" .
          else
            "$RUNNER_TEMP/gitleaks/gitleaks" git --no-banner --redact --exit-code 1 --gitleaks-ignore-path .gitleaksignore .
          fi

  # The specialist's image, built as Home Assistant builds it, and its embedded build id compared with
  # the source tree's (0.24.0, tenth round): the install step keys its migration and the dry run to that
  # id, so the image and the tree must agree. Not a required check; it reports on every push.
  # Twentieth round: built with --no-cache and plain progress, so every layer is built in this run and
  # the log shows each one (a CACHED layer fails the job), and stamped with this run's id as a label,
  # checked before the compare, so the image compared can only be the one built here.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the specialist's image
        run: |
          set -o pipefail
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --no-cache --pull --progress=plain --label "harness.ci.run=$stamp" -t harness-ci harness 2>&1 | tee build.log
          if grep -E '^#[0-9]+ CACHED' build.log; then echo "a layer came from cache"; exit 1; fi
      - name: The image's build id equals the source tree's
        run: |
          stamp="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          built=$(docker image inspect -f '{{ index .Config.Labels "harness.ci.run" }}' harness-ci)
          echo "built in run: $built (this run: $stamp)"
          test "$built" = "$stamp"
          tree=$(python3 harness/app/harness/buildid.py harness harness/app)
          image=$(docker run --rm --entrypoint cat harness-ci /opt/harness/BUILD_ID)
          echo "source tree: $tree"
          echo "image:       $image"
          test -n "$tree" && test "$tree" = "$image"
