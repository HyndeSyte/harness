name: tests

# `pytest` and `bun` are required checks on main (RELEASING.md). Keep the job
# names fixed, and add no paths or branches filters and no job-level `if`: a
# required check must run and report on every pull request. check_pr.py fails a
# pull request that changes that.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # PyYAML for tests/test_check_pr.py (the pr check parses YAML); the Apps don't use it.
      - run: pip install pytest "PyYAML==6.0.2"
      - run: python -m pytest -q -p no:cacheprovider

  # Cain's tests. Same Bun as Cain's image (cain/Dockerfile BUN_VERSION).
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun test cain/tests

  # Round 21: the shared logs' flock (bun:ffi into libc) on arm64, the Pi's architecture: the start probe, the lock and
  # its errors, in an arm64 container under QEMU. Same Bun as Cain's image.
  # Round 22: evidence for symbol resolution (flock, errno) and the foreign-function path on arm64, under user-mode
  # emulation on an x86 host, plus the start probe's contention self-test; not proof of the Pi's kernel. The real arm64
  # gate is the Pi start probe plus the combined fault scenario. Making this job a required check is the owner's ruleset change.
  arm64-flock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - run: >-
          docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w oven/bun:1.4.4
          sh -c 'uname -m && bun test cain/tests/source-check-round21.test.ts -t "flock" && bun test cain/tests/source-check-round20.test.ts -t "OS advisory lock" && bun test cain/tests/source-check-round22.test.ts -t "start probe"'
