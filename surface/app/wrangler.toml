# Cloudflare Pages, for the app's web build (surface/README.md, Deploy). Not deployed yet.
# A Direct Upload project: Cloudflare never builds it. CI builds and checks dist once (the surface
# workflow's surface-app job), keeps it as an artifact, and its surface-pages-deploy job deploys
# exactly that artifact with `wrangler pages deploy dist --project-name surface`.
# The whole hostname sits behind Cloudflare Access; /snapshot on it is the Worker's route.
name = "surface"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"
