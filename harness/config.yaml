# https://developers.home-assistant.io/docs/apps/configuration
# Deliberately narrow: no Home Assistant API, no Supervisor API, no mapped
# folders, no host ports. Its only state is /data. Its only page is Ingress.
# It also listens on 8100 for Family calendar pushes from Home Assistant, on
# the internal add-on network only (no host port is mapped; see family.py).
name: Harness
version: "0.3.0"
slug: harness
description: >-
  One private Telegram thread with Claude and GPT as engines. A small
  deterministic controller decides everything; nothing changes without your tap.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:message-lock-outline
panel_title: Harness
panel_admin: true
homeassistant_api: false
hassio_api: false
auth_api: false
backup: cold
# Seconds Supervisor waits for a clean stop (default 10). The controller
# interrupts its long poll on SIGTERM; this is margin for closing the ledger.
timeout: 30
