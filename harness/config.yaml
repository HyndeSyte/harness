# https://developers.home-assistant.io/docs/apps/configuration
# Deliberately narrow: no Home Assistant API, no Supervisor API, no mapped
# folders, no host ports. Its only state is /data. Its only page is Ingress.
# It also listens on 8100 for Family calendar pushes from Home Assistant, on
# the internal add-on network only (no host port is mapped; see family.py).
name: Harness
version: "0.21.2"
slug: harness
description: >-
  The calendar specialist behind Cain on Discord, with Claude and GPT as engines. A small
  deterministic controller decides everything. Clear calendar changes you ask for are
  done at once with a receipt and Undo once you turn them on; anything that looks pasted gets a tap.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:message-lock-outline
panel_title: Harness
panel_admin: true
homeassistant_api: false
hassio_api: false
auth_api: false
backup: cold
# Seconds Supervisor waits for a clean stop (default 10). The controller
# interrupts its long poll on SIGTERM; this is margin for closing the ledger.
timeout: 30
# The first name on copies from Gmail (family_copy.py). Empty leaves copying off.
# The Family events that block his Gmail calendar (family_gmail.py), as
# "Family title => Gmail title". Empty leaves that off.
# The Family events that mean a school day, with ";" between several, for
# drop-off and pickup blocks (family_gmail.py). Empty leaves that off.
# Changing events he asks for on Family and Gmail, with no tap (calendar_change.py).
# Writing dates from his mail onto his Gmail calendar (mail_dates.py). Off: found, not written.
# Judging what Family events mean for him, in shadow (meaning.py): scored in the log, writes no calendar.
# Home, for drive blocks around the events he goes to (family_gmail.py): "lat, lon" or a street address.
# Empty leaves drive blocks off.
options:
  family_copy_name: ""
  family_to_gmail: ""
  family_school: ""
  family_school_address: ""
  calendar_changes: false
  mail_dates: false
  meaning_shadow: false
  meaning_live: false
  home_location: ""
schema:
  family_copy_name: str?
  family_to_gmail: str?
  family_school: str?
  family_school_address: str?
  calendar_changes: bool?
  mail_dates: bool?
  meaning_shadow: bool?
  meaning_live: bool?
  home_location: str?
